name: Verify desktop platforms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Desktop startup and worker smoke (macOS / Windows)
        if: runner.os != 'Linux'
        run: npx electron scripts/smoke-desktop.cjs
      - name: Desktop startup and worker smoke (Linux CI display)
        if: runner.os == 'Linux'
        # GitHub's ephemeral Linux runner restricts the Chromium namespace sandbox.
        # This flag is confined to the CI process; shipped launchers keep it enabled.
        run: xvfb-run -a npx electron --no-sandbox scripts/smoke-desktop.cjs
      - name: Coupled scenario, replay and cancellation (macOS / Windows)
        if: runner.os != 'Linux'
        run: npx electron scripts/smoke-coupled.cjs
      - name: Coupled scenario (Linux CI display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox scripts/smoke-coupled.cjs
